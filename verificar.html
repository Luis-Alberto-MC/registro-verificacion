<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar Código</title>
<style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, serif; background: #eafaf0; color: #222; padding: 15px; }
    .titulo { text-align: center; color: #008f5a; border: 1px solid #c8e6c9; border-radius: 10px; padding: 15px; font-size: 32px; letter-spacing: 2px; background: white; margin-bottom: 20px; }
    .caja { background: white; border: 1px solid #c8e6c9; border-radius: 15px; padding: 25px; max-width: 500px; margin: auto; text-align: center; }
    .caja h2 { color: #ff6b00; margin: 0 0 10px 0; font-size: 28px; }
    .caja p { font-family: Arial, sans-serif; font-size: 16px; color: #444; }
    label { display: block; color: #008f5a; margin-top: 20px; font-size: 18px; font-weight: bold; }
    input { width: 80%; padding: 14px; margin-top: 10px; background: #f2fdf6; border: 1px solid #a5d6a7; border-radius: 8px; color: #222; font-size: 24px; font-family: Arial, sans-serif; text-align: center; letter-spacing: 6px; font-weight: bold; }
    button { margin-top: 25px; background: #008f5a; color: white; border: none; padding: 14px 22px; border-radius: 8px; font-size: 18px; cursor: pointer; width: 80%; font-weight: bold; }
    .link { display: block; text-align: center; margin-top: 20px; color: #008f5a; text-decoration: none; font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; }
    .msg-ok { background: #e8f5e9; color: #1b5e20; border: 1px solid #a5d6a7; padding: 15px; border-radius: 8px; font-family: Arial, sans-serif; font-size: 16px; margin-top: 15px; }
    .msg-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; padding: 12px; border-radius: 8px; font-family: Arial, sans-serif; font-size: 15px; margin-top: 15px; }
</style>
</head>
<body>

<div class="titulo">Verificación de correo</div>

<div class="caja">
    <h2>Confirma tu código</h2>
    <p id="subtituloCorreo"></p>
    <div id="cajaMensaje"></div>

    <form id="formVerificar">
        <label>Ingresa el código:</label>
        <input type="text" id="codigoInput" required maxlength="6" pattern="[0-9]{6}" placeholder="000000" autocomplete="off"><br>
        <button type="submit">Verificar código</button>
    </form>
</div>

<a class="link" href="index.html">← Volver al formulario de registro</a>

<script>
const subtitulo = document.getElementById('subtituloCorreo');
const cajaMensaje = document.getElementById('cajaMensaje');
const form = document.getElementById('formVerificar');

// Leer datos guardados en el navegador
const rawDatos = sessionStorage.getItem('verificacion_usuario');
const datos = rawDatos ? JSON.parse(rawDatos) : null;

if (datos && datos.correo) {
    subtitulo.innerHTML = `Enviamos un código de 6 dígitos a:<br><b>${datos.correo}</b>`;
} else {
    cajaMensaje.innerHTML = `<div class="msg-error">No hay ninguna verificación activa. Regístrate primero.</div>`;
    form.style.display = 'none';
}

form.addEventListener('submit', function(e) {
    e.preventDefault();
    const codigoIngresado = document.getElementById('codigoInput').value.trim();

    if (!datos) {
        cajaMensaje.innerHTML = `<div class="msg-error">Sesión no encontrada. Vuelve al registro.</div>`;
        return;
    }

    // Validar expiración
    if (Date.now() > datos.expira) {
        sessionStorage.removeItem('verificacion_usuario');
        cajaMensaje.innerHTML = `<div class="msg-error">El código ha expirado (10 min). Solicita uno nuevo.</div>`;
        form.style.display = 'none';
        return;
    }

    // Validar código
    if (codigoIngresado === datos.codigo) {
        sessionStorage.removeItem('verificacion_usuario'); // Limpiar para no reutilizar
        subtitulo.style.display = 'none';
        form.style.display = 'none';
        cajaMensaje.innerHTML = `
            <div class="msg-ok">
                <strong>¡Correo verificado con éxito!</strong><br><br>
                Bienvenido, <b>${datos.nombre} ${datos.apellidos}</b>.<br>
                Tu correo <b>${datos.correo}</b> ha sido confirmado.
            </div>
        `;
    } else {
        cajaMensaje.innerHTML = `<div class="msg-error">Código incorrecto. Revisa tu bandeja e intenta de nuevo.</div>`;
    }
});
</script>

</body>
</html>
